<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlyDNA</title>

<link rel="stylesheet" href="style.css?v=4">

</head>

<body>

<div id="app">

    <div class="logo">

        🧬

        <h1>FlyDNA</h1>

        <p>
            How deeply did this music move you?
        </p>

    </div>

    <div class="track">

        <h2 id="trackTitle">
            Loading...
        </h2>

    </div>

    <div class="intensity">

        <input
            id="intensity"
            type="range"
            min="1"
            max="10"
            value="5">

        <div id="intensityValue">
            5 / 10
        </div>

    </div>

    <div class="emotions">

        <label>
            Choose emotions
        </label>

        <div id="emotionContainer">
        </div>

        <div
            id="emotionCounter"
            class="emotion-counter">
            0 of 3 emotions selected
        </div>

    </div>

    <button id="submitBtn">

        🧬 Contribute Your DNA to the Community

    </button>

    <div id="status">
    </div>

    <hr>

    <h3>
        Community DNA
    </h3>

    <div class="stats">

        <div class="stat">

            <span>
                Community Contributors
            </span>

            <strong id="fd-total">
                0
            </strong>

        </div>

        <div class="stat">

            <span>
                Average Emotional Impact
            </span>

            <strong id="fd-intensity">
                0 / 10
            </strong>

        </div>

        <div class="stat">

            <span>
                Community Emotional DNA
            </span>

            <strong id="fd-dominant">
                -
            </strong>

        </div>

        <div id="fd-breakdown">
        </div>

    </div>

</div>

<!-- Load order is important -->

<script src="emotions.js?v=2"></script>
<script src="renderer.js?v=4"></script>
<script src="api.js?v=3"></script>
<script src="app.js?v=3"></script>

</body>

</html>
