<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlyDNA</title>

<link rel="stylesheet" href="style.css?v=5">

</head>

<body>

<div id="app">

    <!-- ==================================
         TRACK
         ================================== -->

    <div class="track">

        <h2 id="trackTitle">
            Loading...
        </h2>

    </div>


    <!-- ==================================
         INTENSITY
         ================================== -->

    <div class="intensity">

        <input
            id="intensity"
            type="range"
            min="1"
            max="10"
            value="5">

        <div id="intensityValue">
            5 / 10
        </div>

    </div>


    <!-- ==================================
         EMOTIONS
         ================================== -->

    <div class="emotions">

        <label>
            What did you feel?
        </label>

        <div id="emotionContainer">
        </div>

        <div
            id="emotionCounter"
            class="emotion-counter">
            0 of 3 emotions selected
        </div>

    </div>


    <!-- ==================================
         SUBMIT
         ================================== -->

    <button id="submitBtn">

        🧬 Contribute Your DNA to the Community

    </button>


    <!-- ==================================
         STATUS
         ================================== -->

    <div id="status">
    </div>

</div>


<!-- ======================================
     LOAD ORDER
     ====================================== -->

<script src="emotions.js?v=2"></script>
<script src="renderer.js?v=3"></script>
<script src="api.js?v=3"></script>
<script src="app.js?v=3"></script>

</body>

</html>
